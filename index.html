async function open(item){selection=item;$('#related').replaceChildren();for(const ref of item.references||[]){const related=lookup(ref.category,ref.id,ref.category==='templates'?ref.file:null);if(!related)continue;const row=document.createElement('div');row.className='related-item';const b=document.createElement('button');b.textContent=ref.id;const label=document.createElement('div');label.className='small';label.textContent=ref.relationship;b.onclick=()=>open(related);row.append(label,b);$('#related').append(row);}const spawned=[...new Set((item.standalone_spawns||[]).map(x=>x.type_id))];for(const id of spawned){const related=lookup('objects','object_'+String(id).padStart(3,'0'));if(!related)continue;const b=document.createElement('button');b.textContent='Spawn reference: '+related.id;b.onclick=()=>open(related);$('#related').append(b);}const select=$('#sequence');select.replaceChildren();select.hidden=!item.animations;if(item.animations){item.animations.forEach((animation,n)=>{const option=document.createElement('option');option.value=n;option.textContent=animation.id;select.append(option);});}const initial=sequenceIndex(item);if(item.animations)select.value=String(initial);await loadSelection(initial);if(!$('dialog').open)$('dialog').showModal();}
async function loadFrameImages(sources,isCurrent=()=>true){
 const images=new Array(sources.length),requests=new Map();let cursor=0,failure;
 async function request(src){
  for(let attempt=0;attempt<3;attempt++){
   try{return await new Promise((resolve,reject)=>{const im=new Image;im.crossOrigin="anonymous";im.onload=()=>resolve(im);im.onerror=()=>reject(new Error('Unable to load '+src));im.src=src;});}
   catch(error){if(attempt===2||!isCurrent())throw error;await new Promise(resolve=>setTimeout(resolve,200*(attempt+1)));if(!isCurrent())throw error;}
  }
 }
 async function worker(){
  while(isCurrent()&&!failure){
   const index=cursor++;if(index>=sources.length)return;
   const src=sources[index];if(!requests.has(src))requests.set(src,request(src));
   try{images[index]=await requests.get(src);}catch(error){failure=error;}
  }
 }
 await Promise.all(Array.from({length:Math.min(4,sources.length)},()=>worker()));
 if(failure)throw failure;return images;
}
async function loadSelection(n){const version=++loadVersion;loaded=[];active=selection.animations?{...selection.animations[n],id:selection.id+' / '+selection.animations[n].id}:selection;frame=0;playing=false;ended=false;last=0;ticks=0;$('#play').textContent='Play';$('#title').textContent=selection.title?(selection.title+(selection.animations?' / '+selection.animations[n].id:'')):active.id;$('#scope').textContent=active.status||selection.status||'';$('#zoom').value=['map_pages','text_layout','font_atlas'].includes(active.kind)?'1':'3';$('#status').textContent=active.kind==='text_layout'?'Combined text layout':active.kind==='font_atlas'?'Font character atlas':active.kind==='base_state'?'Verified normal base pose':active.kind==='variants'?'Recovered graphics variants':selection.animations?(selection.normal_state_graph?'Reviewed player sequence':'Verified graphics sequence'):active.kind==='object'?'Partial object reconstruction':active.kind==='map_pages'?'Reconstructed background pages':active.kind==='variants'?'Recovered graphics variants':active.frames?'Recovered graphics sequence':'Partial reconstruction';$('#frame').max=active.frames?active.frames.length-1:0;$('#frame').value=0;$('#play').disabled=!active.frames||active.frames.length<2||['map_pages','text_layout','font_atlas'].includes(active.kind);$('#frame').disabled=!active.frames;let images;$('#frameInfo').textContent='Loading animation frames…';try{images=await loadFrameImages(active.frames?active.frames.map(f=>f.file):active.file?[active.file]:[],()=>version===loadVersion);}catch(error){if(version!==loadVersion)return;console.error(error);$('#frameInfo').textContent='Could not load animation frames. Select the sequence again to retry.';$('#play').disabled=true;$('#frame').disabled=true;return;}if(version!==loadVersion)return;loaded=images;viewGeometry=viewerGeometry(active,loaded);playing=!$('#play').disabled;$('#play').textContent=playing?'Pause':'Play';draw();}
function viewerGeometry(sequence,images){
 if(!images.length)return null;
 return CatalogDownloads.frameBounds(sequence.frames||images.map(()=>({})),images);
}
function draw(){
 if(!active)return;
 const c=$('canvas'),ctx=c.getContext('2d'),z=Number($('#zoom').value),im=loaded[frame],f=active.frames?.[frame],b=viewGeometry;
 const width=im&&b?Math.max(384,Math.ceil((b.width+16)*z)):384,height=im&&b?Math.max(384,Math.ceil((b.height+16)*z)):384;
 // Resizing resets both the drawing buffer and canvas layout. Only a new
 // sequence or zoom level can change its dimensions, never a running frame.
 if(c.width!==width)c.width=width;if(c.height!==height)c.height=height;
 ctx.clearRect(0,0,width,height);ctx.imageSmoothingEnabled=false;
 $('#download').hidden=!im;
 if(!im){ctx.fillStyle='#b8c0cd';ctx.font='16px system-ui';ctx.fillText(active.frames?.length?'Loading animation frames…':'Graphics reconstruction unresolved',24,190);return;}
 const x=(width-b.width*z)/2+(-b.left-(f?.origin_upright_px?.[0]||0))*z;
 const y=(height-b.height*z)/2+(-b.top-(f?.origin_upright_px?.[1]||0))*z;
 ctx.drawImage(im,Math.round(x),Math.round(y),im.width*z,im.height*z);
 $('#frameInfo').textContent=f?`${active.kind==='text_layout'?'Layout':active.kind==='map_pages'?'Page':active.kind==='base_state'?'Base pose':active.kind==='variants'?'Variant':'Frame'} ${frame+1}/${active.frames.length}${f.label?' · '+f.label:''}${active.kind?'':` · ${f.duration_ticks} ticks`} · ${im.width} × ${im.height}`:`${im.width} × ${im.height} pixels`;
 $('#metadata').textContent=JSON.stringify(f||active,null,2);$('#download').href=f?f.file:active.file;$('#frame').value=frame;
}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;history.replaceState(null,'','#'+tab);render()});$('#filter').oninput=render;$('#close').onclick=()=>{$('dialog').close();playing=false};$('#zoom').onchange=draw;$('#frame').oninput=()=>{frame=Number($('#frame').value);ticks=0;ended=false;draw()};$('#sequence').onchange=()=>{const n=Number($('#sequence').value);setGalleryState(selection,n);loadSelection(n);};$('#play').onclick=()=>{if(ended){frame=0;ended=false;draw();}playing=!playing;last=0;ticks=0;$('#play').textContent=playing?'Pause':'Play'};
$('dialog').addEventListener('close',()=>{playing=false;loadVersion++;});
$('#galleryPlay').onclick=()=>{galleryPlaying=!galleryPlaying;const label=galleryPlaying?'Pause thumbnails':'Play thumbnails';$('#galleryPlay').setAttribute('aria-label',label);$('#galleryPlay').title=label;$('#galleryPlay path').setAttribute('d',galleryPlaying?'M6 4h4v16H6zM14 4h4v16h-4z':'M6 3l15 9-15 9z');$('#galleryPlay').setAttribute('aria-pressed',String(galleryPlaying));for(const p of previews)p.last=0;};
$('#fps').onchange=()=>{animationFps=Number($('#fps').value);ticks=0;last=0;for(const p of previews){p.ticks=0;p.last=0;}};
function animate(t){for(const p of previews){if(!galleryPlaying||!p.visible||document.hidden||p.sequence.frames.length<2||['map_pages','text_layout','font_atlas'].includes(p.sequence.kind)){p.last=0;continue;}if(p.last){p.ticks+=Math.min(t-p.last,250);let changed=false;while(p.ticks>=thumbnailDuration(p.sequence,p.index)){p.ticks-=thumbnailDuration(p.sequence,p.index);p.index=nextFrame(p.sequence,p.index);changed=true;}if(changed)presentPreview(p);}p.last=t;}if(playing&&active?.frames){if(last){ticks+=Math.min(t-last,250);while(ticks>=thumbnailDuration(active,frame)){ticks-=thumbnailDuration(active,frame);if(frame+1<active.frames.length){frame++;}else{frame=nextFrame(active,frame);}draw();}}last=t;}requestAnimationFrame(animate)}render();requestAnimationFrame(animate);
}
startCatalog().catch(error=>{
 document.querySelector('#summary').textContent='Unable to load the catalog. '+error.message;
 console.error(error);
});
